<input type="text" placeholder="Procure seu Pokemon" (input)="getPokemon($any($event.target).value)">

<div class="card">
  <div class="card__title">
    <h3>{{pokemon.name | titlecase | transformador:'Dyonatas':'T0K3N'}}</h3>
  </div>
  <div class="card__body">
    <img src="{{pokemon.sprites.front_default}}" alt="pokemon" srcset="">
  </div>
  <div class="card__stats">
    @for ( t of pokemon.types; track t) {
      <span class="card__stats__type" >{{t.type.name | uppercase}}</span>
    }
  </div>
</div>
